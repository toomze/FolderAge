name: Build FolderAge

# Запуск вручную (Actions → Run workflow) — DMG в артефактах.
# Публикация релиза на GitHub (Releases → Draft a new release → тег vX.Y.Z → Publish) —
# DMG собирается и прикрепляется к этому релизу автоматически.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swiftc --version

      - name: Build app and dmg
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then VERSION="${RELEASE_TAG#v}"; else VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          chmod +x build.sh
          VERSION="$VERSION" ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderAge-dmg
          path: build/*.dmg

      - name: Attach dmg to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
