name: Build FolderAge

# Запуск вручную (Actions → Run workflow) — DMG в артефактах.
# Публикация релиза (Releases → Draft a new release → тег vX.Y.Z → Publish) —
# DMG и appcast.xml для автообновления прикрепляются к релизу автоматически.
# Если релизная сборка застряла в очереди GitHub: Run workflow → в поле release_tag указать тег
# уже опубликованного релиза (например, v1.4.1) — сборка прикрепит файлы к нему.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег уже опубликованного релиза, к которому прикрепить DMG и appcast (пусто — просто тестовая сборка)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swiftc --version

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [[ -z "$ID" ]]; then echo "::error::В сертификате нет Developer ID Application"; exit 1; fi
          echo "Подпись: $ID"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build app and dmg
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then VERSION="${RELEASE_TAG#v}"; else VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          export VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x build.sh make_appcast.sh
          ./build.sh
          # Копия с постоянным именем: .../releases/latest/download/FolderAge.dmg всегда ведёт на последнюю версию
          cp "build/FolderAge-$VERSION.dmg" build/FolderAge.dmg

      - name: Sign update and write appcast
        if: env.RELEASE_TAG != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::Нет секрета SPARKLE_PRIVATE_KEY — автообновление не будет работать. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$RELEASE_NOTES" > build/notes.txt
          ./make_appcast.sh build/notes.txt

      - name: Upload artifact
        continue-on-error: true   # сбой хранилища артефактов не должен срывать прикрепление DMG к релизу
        uses: actions/upload-artifact@v4
        with:
          name: FolderAge-dmg
          path: build/*.dmg

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/*.dmg
            build/appcast.xml
